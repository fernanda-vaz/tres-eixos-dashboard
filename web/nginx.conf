server {
    listen 80;
    root /usr/share/nginx/html;
    # Maior corpo aceito pela API: a importação de pedidos (POST /api/imports/orders, até 256 kB).
    client_max_body_size 256k;

    # Cabeçalhos de segurança do HTML (é o HTML, não o JSON, que pode ser enquadrado em iframe).
    # Também valem para as respostas da API que passam por aqui (proxy_hide_header evita duplicar).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Só scripts e chamadas da própria origem; fontes do Google Fonts (index.html); nada inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Com HTTPS no terminador (Caddy/certbot), habilite:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /api/products → http://api:3000/products (a barra final remove o prefixo /api).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O mesmo id aparece no log do nginx e no da API (e volta na resposta em X-Request-Id).
        proxy_set_header X-Request-Id $request_id;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        # Cabeçalhos do bloco server não são herdados por um location que define os seus; repetidos aqui.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Assets com hash no nome: cache longo. index.html não entra aqui (precisa refletir cada deploy).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Painel com rotas no hash (#/pedidos): o servidor só entrega o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
