name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Um único npm ci na raiz (workspaces): contratos, API e painel.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run deps:check
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    services:
      # Banco isolado do CI: nunca o banco real da loja.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://app:ci_password@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t tres-eixos-api:ci .
      - run: docker build -f web/Dockerfile -t tres-eixos-web:ci .
