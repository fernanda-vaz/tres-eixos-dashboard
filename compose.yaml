services:
  postgres:
    image: postgres:16-alpine
    container_name: tres-eixos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: app
    ports:
      # Publicado só em 127.0.0.1: o banco nunca fica exposto na rede.
      - "127.0.0.1:5434:5432"
    volumes:
      - tres_eixos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Dentro do Compose o banco é o serviço "postgres", porta interna 5432 (localhost seria a própria API).
      DATABASE_URL: postgresql://app:app_dev_password@postgres:5432/app
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      # Local é HTTP; no deploy com HTTPS, deixe true e configure TRUST_PROXY.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # O painel (nginx) é o único proxy à frente da API no Compose.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      # Porta no host configurável: API_HOST_PORT no .env (padrão 8080).
      - "127.0.0.1:${API_HOST_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Publica os eventos do outbox. Defina OUTBOX_WEBHOOK_URL para enviar por HTTP; sem ela, registra no log.
  worker:
    build: ./api
    command: ["node", "dist/src/worker.js"]
    environment:
      DATABASE_URL: postgresql://app:app_dev_password@postgres:5432/app
      OUTBOX_WEBHOOK_URL: ${OUTBOX_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # O worker não atende HTTP: o healthcheck da imagem (que chama /ready) não se aplica.
    healthcheck:
      disable: true

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tres_eixos_pgdata:
